# ============================================================================
# Aurora Goods — canonical policy parameter table
# ============================================================================
# This file is the SINGLE SOURCE OF TRUTH for evaluation. Graders compare an
# agent's answer against this table, never against the text the agent happened
# to retrieve. That distinction is the point of the whole corpus:
# FAILURE-TAXONOMY.md §10 "Boşluq 3" — RAGAS-style faithfulness is measured
# against retrieved context, so a stale-but-faithfully-quoted answer scores 1.0
# while being wrong. Here, `status: active` defines truth; `status: superseded`
# defines the trap.
#
# Every entry is machine-decidable. If deciding the correct answer required
# human judgement, the entry does not belong here.
# ============================================================================

meta:
  company: Aurora Goods
  corpus_version: "1.0"
  generated: 2026-08-26
  currency: AZN
  timezone: Asia/Baku          # UTC+04:00, no DST
  language: en
  # PINNED evaluation clock. The mock tool service reports this value as
  # `today` in every response, so no test depends on wall-clock time.
  evaluation_reference_date: 2026-09-01
  documents:
    - {file: returns-and-refunds.md,        id: AG-POL-RET, version: "4.0", effective_from: 2026-01-01, supersedes_version: "3.2"}
    - {file: shipping-and-delivery.md,      id: AG-POL-SHP, version: "2.3", effective_from: 2026-04-01, supersedes_version: "2.2"}
    - {file: warranty-policy.md,            id: AG-POL-WAR, version: "3.1", effective_from: 2026-02-01, supersedes_version: "3.0"}
    - {file: payments-and-billing.md,       id: AG-POL-PAY, version: "1.9", effective_from: 2026-05-01, supersedes_version: "1.8"}
    - {file: account-and-membership.md,     id: AG-POL-ACC, version: "2.0", effective_from: 2026-03-01, supersedes_version: "1.7"}
    - {file: privacy-and-data.md,           id: AG-POL-PRV, version: "1.4", effective_from: 2026-01-01, supersedes_version: "1.3"}
    - {file: promotions-and-price-match.md, id: AG-POL-PRM, version: "5.2", effective_from: 2026-06-01, supersedes_version: "5.1"}
    - {file: international-shipping.md,     id: AG-POL-INT, version: "1.6", effective_from: 2026-07-01, supersedes_version: "1.5"}

# ----------------------------------------------------------------------------
# Precedence ladder — resolves every apparent contradiction deterministically.
# First matching rank wins; lower ranks are not evaluated.
# ----------------------------------------------------------------------------
precedence_ladder:
  - {rank: 1, rule: non_returnable_or_clearance, source: "returns-and-refunds.md §6, promotions-and-price-match.md §4"}
  - {rank: 2, rule: damaged_defective_or_wrong_item, source: "returns-and-refunds.md §5"}
  - {rank: 3, rule: international_destination, source: "international-shipping.md §5"}
  - {rank: 4, rule: promotional_item, source: "promotions-and-price-match.md §2"}
  - {rank: 5, rule: aurora_plus_member, source: "account-and-membership.md §3"}
  - {rank: 6, rule: standard, source: "returns-and-refunds.md §2"}

# ----------------------------------------------------------------------------
# Shared counting rules — stated once so no case depends on interpretation.
# ----------------------------------------------------------------------------
counting_rules:
  return_window:
    anchor: delivery_date
    anchor_is_day: 0
    inclusive_final_day: true
    closes_at: "23:59 Asia/Baku"
    calendar_or_business: calendar
    note: "A window of N days is open on elapsed days 0..N inclusive and closed from N+1."
  price_match_window:
    anchor: order_date          # deliberately different from every return window
    anchor_is_day: 0
    inclusive_final_day: true
    calendar_or_business: calendar
  warranty_period:
    anchor: delivery_date
    unit: months
    inclusive_final_day: true
    note: "N months after delivery, same day-of-month; that day is covered. If the target month lacks that day number, the last day of the month."
  shipping_sla:
    anchor: dispatch_date
    calendar_or_business: business

# ----------------------------------------------------------------------------
# Which policy version governs a given question.
# ----------------------------------------------------------------------------
temporal_applicability:
  default: current_version
  note: "Unless a rule is listed below, the version in force TODAY governs."
  rules:
    - subject: warranty_period_length
      governed_by: version_in_force_on_delivery_date
      source: "warranty-policy.md §1.3"
      consequence: "A product delivered before 2026-02-01 carries the v3.0 periods (Aurora brand 18 months, no Aurora Plus extension) even though v3.1 is current. Appendix A is therefore live law for old deliveries, not dead text."
    - subject: service_fees_incurred_today
      governed_by: current_version
      source: "warranty-policy.md §1.3"
      consequence: "The out-of-warranty diagnostic fee is 25.00 AZN today regardless of when the product was delivered."
    - subject: return_window
      governed_by: version_in_force_on_order_date
      source: "returns-and-refunds.md Appendix A preamble"
      consequence: "Every order in FIXTURES.yaml with a return question was placed on or after 2026-01-01, so the 14-day window governs all of them. The 30-day clause is never the correct answer for any fixture order."
    - subject: membership_fee_refund_basis
      governed_by: fee_actually_charged
      source: "account-and-membership.md §5.2"
      consequence: "A member charged 39.00 AZN under v1.7 has a pro-rata refund computed on 39.00, not on the current 49.00."

# ----------------------------------------------------------------------------
# How monetary thresholds are measured.
# ----------------------------------------------------------------------------
value_measurement:
  basis: merchandise_value
  definition: "Sum of the prices actually paid for goods."
  excludes: [shipping_charges, express_surcharge, heavy_item_surcharge, cod_handling_fee, plus_membership_fee, duties]
  applies_to:
    [free_shipping_threshold_domestic, free_return_label_threshold, signature_required_threshold,
     cod_max_order_value, instalment_min_order_value, intl_ddp_threshold, intl_max_declared_value]
  source: "shipping-and-delivery.md §4.0, payments-and-billing.md §2.0, returns-and-refunds.md §4.0, international-shipping.md §4.0"

