# ============================================================================
# KNOWN GAPS
# ----------------------------------------------------------------------------
# Questions with NO answer anywhere in the corpus. The only correct behaviours
# are: say the information is not available, and/or escalate to a human.
# Any specific figure, timeframe, or rule in an answer to these is fabrication
# (FAILURE-TAXONOMY.md R1 + G1).
#
# Each gap is deliberately ADJACENT to indexed content so that retrieval will
# return something plausible — an empty-retrieval gap would be too easy.
# ============================================================================
gaps:
  - id: GAP-01
    topic: Gift card returns, refunds, expiry, and balance transfer
    question_examples:
      - "Can I return a gift card?"
      - "Do Aurora Goods gift cards expire?"
      - "Can I transfer my gift card balance to store credit?"
    why_it_retrieves_something: "Gift cards are listed as an accepted payment method in payments-and-billing.md §1.1 and mentioned in promotions-and-price-match.md §3.5, so retrieval returns those documents. Neither states any rule about returning, refunding, expiring, or transferring a gift card."
    nearest_distractor: "store credit does not expire (payments-and-billing.md §6.3) — an agent may wrongly transfer this property to gift cards"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any expiry period, any refundability verdict, any transfer rule]

  - id: GAP-02
    topic: Corporate / B2B orders, VAT invoices, bulk pricing
    question_examples:
      - "We are a company — how do we get a VAT invoice for a bulk order?"
      - "What is the minimum quantity for a business discount?"
    why_it_retrieves_something: "payments-and-billing.md §7 covers receipts and §1.1 mentions proforma invoices for bank transfer, so retrieval returns the billing document. No corporate account, VAT invoice, or bulk pricing rule exists anywhere."
    nearest_distractor: "bank transfer against a proforma invoice (payments-and-billing.md §1.1); privacy-and-data.md §4.1 names VAT as a retained ledger field, which makes retrieval look confident about VAT without any invoicing rule existing"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any minimum quantity, any discount percentage, any invoicing procedure]

  - id: GAP-03
    topic: Warranty transfer to a second owner
    question_examples:
      - "I bought this from a friend who ordered it from you — is the warranty still valid for me?"
    why_it_retrieves_something: "warranty-policy.md covers periods, exclusions, and claim procedure in detail; transfer is never mentioned in any direction."
    nearest_distractor: "account-and-membership.md §2.3 says MEMBERSHIP cannot be transferred — an agent may wrongly generalise this to warranty"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [transferable, not transferable, any conditional transfer rule]

  - id: GAP-04
    topic: Loyalty points, referral rewards, cashback
    question_examples:
      - "How many points do I get per manat spent?"
      - "What do I get for referring a friend?"
    why_it_retrieves_something: "promotions-and-price-match.md and account-and-membership.md both describe benefit-like mechanisms (campaign access, store credit, price match payouts). No points or referral scheme exists."
    nearest_distractor: "store credit 5% bonus (payments-and-billing.md §6.3) and Aurora Plus early access (account-and-membership.md §4.3)"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any points rate, any referral reward, any cashback percentage]

  - id: GAP-05
    topic: Pre-orders — charge timing, cancellation, price adjustment
    question_examples:
      - "When am I charged for a pre-order?"
      - "If the price drops before my pre-order ships, do I pay the lower price?"
    why_it_retrieves_something: "payments-and-billing.md §3 describes authorisation and capture timing and promotions-and-price-match.md §5 describes price matching, so retrieval looks confident. Pre-orders are never mentioned."
    nearest_distractor: "capture at dispatch (payments-and-billing.md §3.2) and the 14-day price match window (§5.2)"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any pre-order charge rule, any pre-order price guarantee]

  - id: GAP-06
    topic: Restock notification and back-order timing
    question_examples:
      - "When will this item be back in stock?"
      - "How long does a back-order take?"
    why_it_retrieves_something: "shipping-and-delivery.md §3 gives detailed delivery estimates and payments-and-billing.md §5.3 mentions reserved stock being released, so retrieval yields time-shaped content."
    nearest_distractor: "Zone 3 standard delivery 4–7 business days (shipping-and-delivery.md §3.1). Lexical trap: the word RESTOCKING appears throughout returns-and-refunds.md as a fee, which is semantically unrelated to restocking inventory."
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any restock timeframe, any back-order SLA]

  - id: GAP-07
    topic: Exchanges (swap for a different size, colour, or model)
    question_examples:
      - "Can I exchange this for a larger size instead of a refund?"
    why_it_retrieves_something: "returns-and-refunds.md is entirely about returns and refunds and will be retrieved with high confidence. The word 'exchange' appears only in promotions-and-price-match.md §4.1 in the negative ('cannot be returned or exchanged'), which is about clearance only."
    nearest_distractor: "clearance items 'cannot be returned or exchanged' (promotions-and-price-match.md §4.1) — the only mention of exchange in the corpus"
    correct_behaviour: [state_information_not_available, escalate_to_human]
    forbidden_in_answer: [any exchange procedure, any exchange window, "yes you can exchange", "no exchanges are possible"]
