# ============================================================================
# Aurora Goods — deterministic tool fixtures
# ============================================================================
# Backing data for the mock service described in TOOLS.md. Every response the
# tools produce is derived from this file and nothing else: no clock, no
# randomness, no network. Identical arguments always yield identical bytes.
#
# Each order carries an `expected` block resolved against CANONICAL.yaml. That
# block is the ground truth a grader asserts on — never the model's reasoning
# and never the retrieved text.
#
# Verified by target/corpus/verify_fixtures.py.
# ============================================================================

