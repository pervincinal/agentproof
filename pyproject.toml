[project]
name = "agentproof"
version = "0.1.0"
description = "Agent reliability audit harness — determinist grader-lər + baseline diff"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai==0.3.260",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["agentproof"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agentproof*"]
