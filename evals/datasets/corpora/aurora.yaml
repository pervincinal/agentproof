# ============================================================================
# ETİKET → ASSERTION xəritəsi — Aurora Goods korpusu
# ----------------------------------------------------------------------------
# `CANONICAL.yaml → parameters[].boundary.points[].expected` etiketlərinin hər
# birinə BİR assertion. Generator (`build_full.py`) bu faylı korpus
# konfiqurasiyasından oxuyur — yeni korpus üçün YENİ FAYL yazılır, KOD
# dəyişmir.
#
# `macro:` → `build_full.py`-dəki adlı regex (çoxdilli lüğət; başqa case
#            blokları da onu işlədir, ona görə kodda qalır)
# `pattern:` → yalnız bu etiketə aid regex
# `invert: true` → pattern cavabda OLMAMALIDIR
#
# Şərhlər `docs/GRADER-AUDIT.md` tapıntılarıdır (A-01…A-26) — canlı qaçışda
# ölçülmüş yalançı yaşıl/qırmızıların səbəbi. SİLMƏ.
# ============================================================================
labels:
  # --- qaytarma pəncərəsi
  eligible: {macro: REJECT, invert: true}
  not_eligible: {macro: REJECT}
  # --- RMA
  rma_valid: {pattern: '(?:rma (?:has )?expired|no longer valid|expired)', invert: true}
  rma_expired: {pattern: '(?:expired|no longer valid|request a new (?:rma|return))'}
  # --- qaytarma etiketi / yük
  label_fee_charged: {pattern: '9[.,]90'}
  label_free: {pattern: '(?:free (?:prepaid )?return label|label is free|no (?:return )?label fee)'}
  parcel_return: {pattern: 'freight', invert: true}
  freight_return: {pattern: '(?:freight|45[.,]00|45 AZN)'}
  # --- tranzit zədəsi
  transit_claim_accepted: {macro: DEADLINE_PASSED, invert: true}
  handled_as_warranty_claim: {pattern: 'warrant'}
  # --- göndərmə kəsim vaxtı
  same_business_day: {pattern: 'same (?:business )?day'}
  next_business_day: {pattern: 'next business day'}
  # --- göndərmə haqqı
  shipping_charged: {pattern: '5[.,]90'}
  shipping_free: {pattern: '(?:free (?:standard )?(?:shipping|delivery)|shipping is free|no shipping (?:charge|fee|cost))'}
  no_surcharge: {pattern: '(?:no (?:heavy[- ]item )?surcharge|surcharge (?:does not|doesn''?t) apply|not[^.]{0,25}surcharge)'}
  surcharge_applies: {pattern: '25[.,]00|\b25 AZN'}
  # --- imza
  signature_optional: {pattern: '(?:no signature|signature (?:is )?not required|without a signature|signature[^.]{0,20}optional)'}
  signature_required: {pattern: 'signature (?:is |will be )?required|require a signature'}
  # --- çatdırılma cəhdləri / depo
  will_attempt_again: {pattern: '(?:attempt again|another (?:delivery )?attempt|one more attempt|third attempt)'}
  last_attempt: {pattern: '(?:last|final|third) (?:delivery )?attempt'}
  no_further_attempt_parcel_at_depot: {pattern: '(?:depot|collection point|pick(?:ed|ing)? (?:it )?up)'}
  collectable: {pattern: '(?:collect|pick (?:it )?up)'}
  returned_to_warehouse: {pattern: '(?:returned to (?:the |our )?warehouse|sent back to (?:the |our )?warehouse|no longer (?:at|held at) the depot)'}
  # --- zəmanət
  in_warranty: {macro: WARRANTY_OVER, invert: true}
  out_of_warranty: {macro: WARRANTY_OVER}
  defect_claim_valid: {pattern: '(?:defect|valid claim|covered|replace)'}
  performing_normally: {pattern: '(?:normal|expected|not (?:a |considered a )?defect|within (?:the )?(?:expected|normal))'}
  # --- ödəniş
  # A-09b: `UNAVAILABLE` invert-i burada YALANÇI MÜSBƏT verirdi — düzgün
  # "bəli" cavabı da düzgün QEYD saxlayır: «COD isn't available for
  # international orders». İnkar iynəsi mövzunu ayırd etmir. Verdikt birbaşa
  # müsbət formada ölçülür.
  # A-24 (docs/GRADER-AUDIT.md): tempered dot yalnız İNKARI bloklayırdı,
  # QAYDA ÇƏRÇİVƏSİNİ yox. Bayat COD limitini işlədən RƏDD cavabı —
  # «cash on delivery is only available for orders of 300.00 AZN or less,
  # so it is not available for your 400.00 AZN basket» — birinci bənddə
  # müsbət qayda ifadəsi saxlayır və köhnə iynə onu VERDİKT sanırdı:
  # yalançı YAŞIL. `only` (və `up to` / `for orders of`) qayda markeridir,
  # verdikt deyil — tempered dot indi onları da kəsir.
  cod_available: {pattern: '(?:(?:cod|cash on delivery)(?:(?!\bnot\b|n''?t\b|\bonly\b|\bunless\b)[^.]){0,30}(?:is |are )?(?:available|allowed|accepted|offered|an option)|you can pay (?:with |by |using )?(?:cash on delivery|cod))'}
  cod_not_available: {macro: UNAVAILABLE}
  instalments_available: {macro: UNAVAILABLE, invert: true}
  # A-10: `not eligible` var idi, `isn't eligible` yox idi; `minimum … 200`
  # var idi, amma agent «200.00 AZN minimum» sırası ilə yazır (rəqəm ƏVVƏL).
  # Üç real cavabın hər üçü fərqli düzgün ifadə işlədib və heç biri tutulmurdu.
  instalments_unavailable: {pattern: '(?:not available|unavailable|isn''?t available|not eligible|isn''?t eligible|(?:does |do )?not qualify|doesn''?t qualify|falls (?:just )?short|just under[^.]{0,25}(?:200|minimum)|below[^.]{0,25}(?:200|the minimum)|minimum[^.]{0,20}200|200(?:[.,]00)?\s*AZN minimum|at least 200)'}
  will_retry_again: {pattern: '(?:retry|try again|another attempt)'}
  final_retry: {pattern: '(?:final|last|third) (?:retry|attempt)'}
  membership_suspended: {pattern: 'suspend'}
  order_still_held: {pattern: '(?:cancell?ed|released)', invert: true}
  order_cancelled_stock_released: {pattern: 'cancell?ed'}
  # --- hesab
  rejected: {pattern: '(?:reject|not (?:be )?accept|too short|at least 10|minimum of 10|exceed|refus)'}
  accepted: {pattern: '(?:reject|refus|too short|exceed|not (?:be )?accept)', invert: true}
  # A-11: `lock` iynəsi tərsinə çevrilmiş halda İŞLƏMİR — "hesabınız hələ
  # kilidlənməyib" cavabı da, "kilidlənib" cavabı da `lock` sətrini saxlayır
  # (`locked`, `lockout`, `unlock`). 4 cəhdlik case-də agentin TAM DÜZGÜN
  # cavabı («your account only locks after 5 … at 4 you're not locked yet»)
  # məhz buna görə "sındı" göstərilirdi. İndi VERDİKT axtarılır, söz kökü yox.
  account_open: {pattern: '(?:not (?:yet )?(?:been )?locked|isn''?t locked|aren''?t locked|no(?:t)? lock(?:ed|out)|account (?:is )?(?:still )?(?:open|active|accessible)|before (?:the |your )?account (?:is |gets )?lock)'}
  # Müsbət tərəf də eyni dərəcədə dar olmalıdır: real qaçışda agent 5 və 6
  # cəhd üçün ÜMUMİYYƏTLƏ cavab vermədi («I don't have access to login
  # systems … if you're locked out, I can escalate») — köhnə `lock` iynəsi bu
  # İMTİNANI "keçdi" saydı, yəni YALANÇI YAŞIL idi (A-08 sinfi). İndi yalnız
  # MÜŞTƏRİNİN hesabına aid TƏSDİQLƏYİCİ verdikt sayılır; şərtli/imtina
  # cümlələri («if you're locked out») tutulmur.
  account_locked: {pattern: '(?:(?:your|the) account (?:is|has been|will (?:now )?be|would be) (?:now )?locked|yes[^.,]{0,30}lock(?:ed|out)|account is locked for|locked for \d+ minutes)'}
  # --- Aurora Plus
  full_refund_if_no_benefit_used: {pattern: 'full refund'}
  prorated_refund_only: {pattern: '(?:pro[- ]?rata|prorated|proportion)'}
  reinstatable: {pattern: '(?:cannot be reinstated|closed permanently|new (?:sign[- ]?up|subscription) (?:is )?required)', invert: true}
  closed_new_signup_required: {pattern: '(?:closed|new (?:sign[- ]?up|subscription|membership))'}
  # --- məxfilik
  cancellable: {pattern: '(?:cannot be cancell?ed|can''?t be cancell?ed|too late to cancel)', invert: true}
  not_cancellable_erasure_in_progress: {pattern: '(?:cannot be cancell?ed|can''?t be cancell?ed|already (?:in progress|started)|too late)'}
  # --- promosyon / clearance
  not_promotional: {pattern: '\b14\b'}
  promotional: {pattern: '\b7\b'}
  # A-13: çılpaq `\b7\b` iynəsi verdikti YOX, yalnız pəncərə rəqəmini ölçürdü.
  # Sual «clearance, yoxsa adi promosyon?» deyə soruşur — düzgün cavab
  # verdiktdir; 7 günlük pəncərə isteğe bağlı əlavədir.
  promotional_not_clearance: {pattern: '(?:not (?:a |treated as )?clearance|isn''?t clearance|not final sale|(?:ordinary|regular|standard) promotional|(?:treated|classified|counts?) as (?:an? )?(?:ordinary |regular )?promotional|promotional(?:,| —| -| item)[^.]{0,30}not clearance|\b7[\s-](?:calendar[\s-])?days?)'}
  clearance: {pattern: '(?:clearance|final sale|cannot be returned|not (?:be )?return)'}
  # --- price match
  # A-12: rədd/qəbul əkizləri İKİ FƏRQLİ pattern işlədirdi, yəni bir tərəfi
  # genişləndirmək digərini asimmetrik qoyurdu. İndi TƏK mənbə var
  # (`PRICE_MATCH_REJECT`) və hər iki etiket ondan törəyir. Genişlənmə səbəbi:
  # agentin real rədd cavabı «it falls outside the price-match window …
  # I can't accept this claim» idi — köhnə pattern-də nə `outside the …
  # window`, nə də `can't accept … claim` var idi.
  claim_accepted: {macro: PRICE_MATCH_REJECT, invert: true}
  claim_rejected: {macro: PRICE_MATCH_REJECT}
  refund_199_99: {pattern: '199[.,]99'}
  refund_200_00: {pattern: '200[.,]00|\b200 AZN'}
  refund_capped_at_200_00: {pattern: '(?:cap|maximum|limit|most)[^.]{0,30}200|200[.,]00'}
  # --- beynəlxalq
