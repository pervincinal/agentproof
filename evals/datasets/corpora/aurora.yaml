# ============================================================================
# KORPUS KONFİQURASİYASI — Aurora Goods
# ----------------------------------------------------------------------------
# `evals/datasets/build_full.py` bu faylı oxuyur. Yeni müştəri korpusu üçün
# YENİ FAYL yazılır, generator KODU dəyişmir — metodoloji iddia («test halları
# siyasət sənədindən törədilir») yalnız belə korpusdan-korpusa keçir.
#
#   corpus_dir  — CANONICAL.yaml və siyasət sənədlərinin qovluğu
#   ref_date    — YAZILMIR: `CANONICAL.yaml → meta.evaluation_reference_date`
#                 -dən oxunur (bir həqiqət mənbəyi qaydası)
#   blocks      — hansı case blokları qaçır. TÖRƏDİLƏN bloklar (`boundary`,
#                 `r6`) hər korpusda işləyir; qalanları Aurora məzmununa ƏL İLƏ
#                 yazılıb və köçürülə bilməz — dürüstlük üçün açıq sadalanır.
# ============================================================================
version: 1
name: aurora
corpus_dir: target/corpus
canonical: CANONICAL.yaml
out: full.jsonl
blocks: [boundary, r6, pairwise, g1, l1, t1, s, baseline, c1, c1_curve, multi]

